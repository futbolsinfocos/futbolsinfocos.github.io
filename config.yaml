# ─────────────────────────────────────────────────────────────
#  Configuración del medio. Todo lo editable está aquí.
# ─────────────────────────────────────────────────────────────

medio:
  nombre: "Sin Focos"
  lema: "El fútbol que no sale en la tele"
  instagram: "@sinfocosfutbol"
  url_web: "https://futbolsinfocos.github.io"   # URL pública donde se sirve la web
  idioma: "es"
  zona_horaria: "Europe/Madrid"

# Modo de publicación:
#   revision   → cada mañana se abre un "pull request" con lo generado. Lo apruebas desde el
#                móvil (botón Merge) y entonces se publica web + Instagram.  (RECOMENDADO al inicio)
#   automatico → se publica directamente sin revisión humana.
modo: revision

# Competiciones. Se resuelven contra API-Football por país + patrón de nombre (regex),
# así no hay que saberse los IDs. Si conoces el ID, puedes poner `id:` directamente.
competiciones:
  # ── LO PRINCIPAL: la RFEF (portada, Instagram y goleadores) ──
  - {pais: Spain, patron: "^Primera División RFEF", etiqueta: "Primera Federación", grupo: espana, prioridad: 1}
  - {pais: Spain, patron: "^Segunda División RFEF", etiqueta: "Segunda Federación", grupo: espana, prioridad: 1}
  - {pais: Spain, patron: "^Tercera División RFEF", etiqueta: "Tercera Federación", grupo: espana, prioridad: 2}
  # ── SEGUNDO PLANO ("Más fútbol"): Segunda División, copas, selecciones y primeras divisiones extranjeras ──
  - {pais: Spain, patron: "^Segunda División$", etiqueta: "LaLiga Hypermotion", grupo: espana, prioridad: 3}
  - {pais: Spain, patron: "^La Liga$", etiqueta: "LaLiga EA Sports", grupo: espana, prioridad: 3}
  - {pais: Spain, patron: "^Copa del Rey$", etiqueta: "Copa del Rey", grupo: espana, prioridad: 3}
  - {pais: World, patron: "^UEFA Champions League$", etiqueta: "Champions League", grupo: internacional, prioridad: 3}
  - {pais: World, patron: "^UEFA Nations League$", etiqueta: "Nations League", grupo: internacional, prioridad: 3}
  - {pais: England, patron: "^Premier League$", etiqueta: "Premier League", grupo: internacional, prioridad: 3}
  - {pais: Italy, patron: "^Serie A$", etiqueta: "Serie A", grupo: internacional, prioridad: 3}
  - {pais: Germany, patron: "^Bundesliga$", etiqueta: "Bundesliga", grupo: internacional, prioridad: 3}
  - {pais: France, patron: "^Ligue 1$", etiqueta: "Ligue 1", grupo: internacional, prioridad: 3}
  - {pais: Portugal, patron: "^Primeira Liga$|^Liga Portugal$|^Liga Portugal Betclic", etiqueta: "Liga Portugal", grupo: internacional, prioridad: 3}
  - {pais: Netherlands, patron: "^Eredivisie$", etiqueta: "Eredivisie", grupo: internacional, prioridad: 3}

# Lo que va delante en la web. Todo lo demás de la lista de arriba sale en "Más fútbol".
principal: ["Primera Federación", "Segunda Federación", "Tercera Federación"]

# Regionales: los partidos gordos de cada jornada que mandan los corresponsales.
#   formulario_url → enlace al formulario de Google para corresponsales (sale en la web)
#   respuestas_csv → la hoja de respuestas en CSV (la hoja tiene que estar compartida: "cualquier persona con el enlace · lector")
# Cada mañana se leen las respuestas nuevas, se redactan (sin inventar nada) y entran en el PR de la edición.
regionales:
  formulario_url: "https://forms.gle/HzTZLtaUDqBGZ2pQ7"
  respuestas_csv: "https://docs.google.com/spreadsheets/d/1S3w3z_9nHEYlvELhirDM8EUAVwgfCpnBxsljcmiFm7s/export?format=csv"
  modelo: "claude-haiku-5-5"
  esfuerzo: "low"
  max_portada: 6

# Noticias (solo web, carpeta contenido/noticias). Se generan con la edición diaria y van en el mismo PR.
noticias:
  activo: true
  modelo: "claude-haiku-5-5"     # modelo barato para las noticias (pedido por Alberto)
  esfuerzo: "low"
  excluir: ["Copa del Rey", "Nations League"]   # competiciones sin noticias de datos
  max_datos_dia: 3               # A · partidos locos y rachas (de nuestros resultados)
  # A · el lunes (resultados del domingo), un resumen del fin de semana por categoría, con todos sus grupos
  resumen_fin_de_semana: ["LaLiga Hypermotion", "Primera Federación", "Segunda Federación", "Tercera Federación"]
  max_fuentes_dia: 3             # B · fichajes y banquillos de otros medios (solo oficiales, citando la fuente)
  horas: 36                      # solo titulares de las últimas 36 horas
  fuentes:
    - {nombre: "AS", url: "https://feeds.as.com/mrss-s/pages/as/site/as.com/section/futbol/subsection/segunda/"}
    - {nombre: "Google Noticias · Primera Federación fichajes", url: "https://news.google.com/rss/search?hl=es&gl=ES&ceid=ES:es&q=%22Primera+Federaci%C3%B3n%22+ficha+OR+fichaje+OR+%22nuevo+jugador%22+when:2d"}
    - {nombre: "Google Noticias · Primera Federación banquillos", url: "https://news.google.com/rss/search?hl=es&gl=ES&ceid=ES:es&q=%22Primera+Federaci%C3%B3n%22+entrenador+OR+destituye+OR+t%C3%A9cnico+when:2d"}
    - {nombre: "Google Noticias · Segunda Federación fichajes", url: "https://news.google.com/rss/search?hl=es&gl=ES&ceid=ES:es&q=%22Segunda+Federaci%C3%B3n%22+ficha+OR+fichaje+OR+%22nuevo+jugador%22+when:2d"}
    - {nombre: "Google Noticias · Segunda Federación banquillos", url: "https://news.google.com/rss/search?hl=es&gl=ES&ceid=ES:es&q=%22Segunda+Federaci%C3%B3n%22+entrenador+OR+destituye+OR+t%C3%A9cnico+when:2d"}
    - {nombre: "Google Noticias · Tercera Federación fichajes", url: "https://news.google.com/rss/search?hl=es&gl=ES&ceid=ES:es&q=%22Tercera+Federaci%C3%B3n%22+ficha+OR+fichaje+OR+%22nuevo+jugador%22+when:2d"}
    - {nombre: "Google Noticias · Tercera Federación banquillos", url: "https://news.google.com/rss/search?hl=es&gl=ES&ceid=ES:es&q=%22Tercera+Federaci%C3%B3n%22+entrenador+OR+destituye+OR+t%C3%A9cnico+when:2d"}
    - {nombre: "Google Noticias · LaLiga Hypermotion banquillos", url: "https://news.google.com/rss/search?hl=es&gl=ES&ceid=ES:es&q=%22Segunda+Divisi%C3%B3n%22+OR+Hypermotion+destituye+OR+%22nuevo+entrenador%22+when:2d"}

# Límites para controlar coste y no saturar a los seguidores
# Pon true cuando la conexión con Instagram (Make o app de Meta) esté probada
instagram_activo: true
# Desde esta fecha, Instagram publica el plan diario (2 partidos destacados + previa + horarios)
# en vez de una publicación por competición
instagram_plan_desde: "2026-11-15"
# Competiciones que salen solo en la web (nunca en Instagram)
solo_web: ["Copa del Rey"]
# Competiciones con muchos grupos: en Instagram van en UNA publicación (un grupo por imagen)
agrupar_instagram: ["Segunda Federación", "Tercera Federación"]

limites:
  max_articulos_dia: 25          # crónicas de jornada (una por competición/grupo con partidos)
  max_previas_dia: 12            # previas de los partidos del día (solo web por ahora)
  max_posts_instagram_dia: 6     # Instagram permite 50/día vía API; 4-6 es lo sano
  max_llamadas_detalle: 25       # llamadas extra para goleadores (solo prioridad 1). Plan gratis: 100 llamadas/día

# Redacción con IA
ia:
  modelo: "claude-opus-5-5"      # alternativa mucho más barata: "claude-haiku-5-5"
  esfuerzo: "low"                # low basta para crónicas cortas a partir de datos
