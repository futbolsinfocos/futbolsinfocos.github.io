# Se lanza al aprobar (Merge) una edición o al publicar en modo automático:
# 1) construye y despliega la web en GitHub Pages  2) publica en Instagram lo pendiente.
name: Publicar

on:
  push:
    branches: [main]
    paths: ["contenido/**", "pipeline/**", "config.yaml"]
  workflow_dispatch:
  schedule:
    - cron: "0 11,17 * * *"   # reintenta posts pendientes (reparte los del fin de semana)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency: publicar

jobs:
  web:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m pipeline web
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
      - id: d
        uses: actions/deploy-pages@v4

  instagram:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Publicar en Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ]; then echo "Instagram aún no configurado; se omite."; exit 0; fi
          python -m pipeline instagram
      - name: Guardar qué se ha publicado
        run: |
          git config user.name "edicion-bot"; git config user.email "edicion-bot@users.noreply.github.com"
          git add contenido/articulos
          git diff --cached --quiet && exit 0
          git commit -m "Marcar posts de Instagram publicados [skip ci]"
          git push
