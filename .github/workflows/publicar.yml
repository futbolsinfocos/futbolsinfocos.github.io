# Se lanza al aprobar (Merge) una edición o al publicar en modo automático:
# 1) construye y despliega la web en GitHub Pages  2) publica en Instagram lo pendiente.
name: Publicar

on:
  push:
    branches: [main]
    paths: ["contenido/**", "pipeline/**", "config.yaml"]
  workflow_dispatch:
    inputs:
      prueba_make:
        description: "Solo mandar un post de prueba a Make (para configurar el escenario)"
        type: boolean
        default: false
      solo_web:
        description: "Solo actualizar la web, sin publicar en Instagram ni en X"
        type: boolean
        default: false
  schedule:
    - cron: "0 11,17 * * *"   # reintenta posts pendientes (reparte los del fin de semana)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency: publicar

jobs:
  web:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m pipeline web
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
      - id: d
        uses: actions/deploy-pages@v4

  instagram:
    needs: web
    if: ${{ !inputs.solo_web }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Publicar en Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          if [ "${{ inputs.prueba_make }}" = "true" ]; then python -m pipeline instagram --prueba-make; exit 0; fi
          if [ -z "$IG_ACCESS_TOKEN" ] && [ -z "$MAKE_WEBHOOK_URL" ]; then echo "Instagram aún no configurado; se omite."; exit 0; fi
          python -m pipeline instagram
      - name: Guardar qué se ha publicado
        run: |
          git config user.name "edicion-bot"; git config user.email "edicion-bot@users.noreply.github.com"
          git add contenido/articulos
          git diff --cached --quiet && exit 0
          git commit -m "Marcar posts de Instagram publicados [skip ci]"
          git push

  x:
    # va después de Instagram para que no se pisen al guardar qué se ha publicado
    needs: [web, instagram]
    if: ${{ !cancelled() && needs.web.result == 'success' && !inputs.solo_web && !inputs.prueba_make }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Publicar en X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          if [ -z "$X_API_KEY" ] || [ -z "$X_ACCESS_TOKEN" ]; then echo "X aún no configurado; se omite."; exit 0; fi
          python -m pipeline x
      - name: Guardar qué se ha publicado
        if: ${{ always() }}
        run: |
          git config user.name "edicion-bot"; git config user.email "edicion-bot@users.noreply.github.com"
          git add contenido/articulos
          git diff --cached --quiet && exit 0
          git commit -m "Marcar posts de X publicados [skip ci]"
          git pull --rebase origin main && git push
