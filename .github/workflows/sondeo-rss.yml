name: Sondeo RSS (temporal)
on:
  push:
    branches: [claude/project-thread-yvjm5l]
    paths: [pipeline/noticias.py, config.yaml, .github/workflows/sondeo-rss.yml]
jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt && python -m pipeline noticias --prueba
