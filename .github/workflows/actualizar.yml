# A mediodía y por la noche: crónicas de los partidos que ya han terminado hoy.
# Se publica directamente en la web (sin Pull Request). Instagram no se toca: sigue con el plan de la mañana.
name: Actualizar resultados

on:
  schedule:
    - cron: "0 14 * * *"     # 15:00 en invierno / 16:00 en verano (hora de Madrid): partidos de la mañana
    - cron: "30 22 * * *"    # 23:30 en invierno / 00:30 en verano: el resto del día
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha AAAA-MM-DD (vacío = hoy en Madrid)"
        required: false

permissions:
  contents: write
  actions: write

concurrency: edicion

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt

      - name: Elegir fecha
        id: f
        run: |
          if [ -n "${{ github.event.inputs.fecha }}" ]; then F="${{ github.event.inputs.fecha }}"
          else
            # a las 00:30 (verano) ya es "mañana" en Madrid: entonces toca el día anterior
            H=$(TZ=Europe/Madrid date +%H)
            if [ "$H" -lt 6 ]; then F=$(TZ=Europe/Madrid date -d yesterday +%F); else F=$(TZ=Europe/Madrid date +%F); fi
          fi
          echo "fecha=$F" >> "$GITHUB_OUTPUT"

      - name: Conectar con nuestro servidor (IP propia para API-Football)
        env:
          SSH_KEY: ${{ secrets.API_FOOTBALL_SSH_KEY }}
          SERVIDOR: ${{ secrets.API_FOOTBALL_SERVIDOR }}
          PROXY: ${{ secrets.API_FOOTBALL_PROXY }}
        run: |
          SERVIDOR=$(printf '%s' "$SERVIDOR" | tr -d '[:space:]')
          if [ -n "$SSH_KEY" ] && [ -n "$SERVIDOR" ]; then
            mkdir -p ~/.ssh && printf '%s\n' "$SSH_KEY" > ~/.ssh/sf && chmod 600 ~/.ssh/sf
            ssh -i ~/.ssh/sf -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 \
                -o ExitOnForwardFailure=yes -f -N -D 1080 "root@$SERVIDOR"
            echo "API_FOOTBALL_PROXY=socks5h://127.0.0.1:1080" >> "$GITHUB_ENV"
            echo "Túnel SSH abierto con $SERVIDOR"
          elif [ -n "$PROXY" ]; then
            echo "API_FOOTBALL_PROXY=$(printf '%s' "$PROXY" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          else
            echo "Sin servidor propio: se llama directo a API-Football"
          fi

      - name: Crónicas de lo ya terminado
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pipeline actualizar --fecha ${{ steps.f.outputs.fecha }}

      - name: Subir y publicar la web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "edicion-bot"; git config user.email "edicion-bot@users.noreply.github.com"
          git add contenido data
          git diff --cached --quiet && { echo "Nada nuevo."; exit 0; }
          git commit -m "Actualización ${{ steps.f.outputs.fecha }} $(TZ=Europe/Madrid date +%H:%M)"
          git pull --rebase -q && git push
          gh workflow run publicar.yml -f solo_web=true
